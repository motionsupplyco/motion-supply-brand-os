name: One-time full-stack integration merge

on:
  push:
    branches: [full-stack-integration-candidate]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout combined P0 candidate
        uses: actions/checkout@v7
        with:
          ref: full-stack-integration-candidate
          fetch-depth: 0

      - name: Merge V3 UX stack without workflow-file mutations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ux-advisor-action-resources

          git show HEAD:browser-tests/v2-release-smoke.spec.js > /tmp/p0-v2-release-smoke.spec.js

          if git merge --no-ff --no-edit origin/ux-advisor-action-resources; then
            echo "::error::Expected the known three-file integration conflict, but merge completed cleanly; refusing stale resolution logic."
            exit 1
          fi

          actual="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' '.github/workflows/v2-browser-smoke.yml' 'browser-tests/v2-release-smoke.spec.js' 'public/index.html' | sort)"
          [ "$actual" = "$expected" ] || { echo "::error::Unexpected conflict set"; printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"; exit 1; }

          # Keep workflow files unchanged for the Actions-token push. The connected
          # GitHub write path will apply the test.yml union after this merge lands.
          git checkout --ours .github/workflows/v2-browser-smoke.yml
          git checkout HEAD -- .github/workflows/test.yml

          # Preserve all UX/V3 release smoke and append only the two P0-only cases.
          git checkout --theirs browser-tests/v2-release-smoke.spec.js
          node <<'NODE'
          const fs=require('fs');
          const targetPath='browser-tests/v2-release-smoke.spec.js';
          const ours=fs.readFileSync('/tmp/p0-v2-release-smoke.spec.js','utf8');
          let target=fs.readFileSync(targetPath,'utf8').trimEnd();
          const marker="test('Shopify CSV import rejects malformed input without saving it and accepts a valid export-shaped file'";
          const keyboard="test('keyboard-only founder flow has skip navigation, labeled fields and operable quick actions'";
          const start=ours.indexOf(marker);
          if(start<0 || ours.indexOf(keyboard,start)<0) throw new Error('P0-only smoke anchors missing');
          if(target.includes(marker) || target.includes(keyboard)) throw new Error('P0-only smoke already present in UX file');
          fs.writeFileSync(targetPath,`${target}\n\n${ours.slice(start).trim()}\n`);
          NODE

          # Preserve UX/V3 app shell and mount P0 accessibility assets once.
          git checkout --theirs public/index.html
          node <<'NODE'
          const fs=require('fs');
          const path='public/index.html';
          let html=fs.readFileSync(path,'utf8');
          const css='<link rel="stylesheet" href="accessibility.css" />';
          const js='<script type="module" src="accessibility.js"></script>';
          if(html.includes(css) || html.includes(js)) throw new Error('Accessibility asset unexpectedly already present');
          if((html.match(/<\/head>/g)||[]).length!==1 || (html.match(/<\/body>/g)||[]).length!==1) throw new Error('HTML insertion anchors are not unique');
          html=html.replace('</head>',`${css}\n</head>`).replace('</body>',`${js}\n</body>`);
          fs.writeFileSync(path,html);
          NODE

          git add .github/workflows/test.yml .github/workflows/v2-browser-smoke.yml browser-tests/v2-release-smoke.spec.js public/index.html
          [ -z "$(git diff --name-only --diff-filter=U)" ] || { echo "::error::Unresolved conflicts remain"; exit 1; }

          test "$(grep -Fc 'accessibility.css' public/index.html)" -eq 1
          test "$(grep -Fc 'accessibility.js' public/index.html)" -eq 1
          test "$(grep -Fc 'id="problemNav"' public/index.html)" -eq 1
          test "$(grep -Fc 'brand-engine-handoff.js' public/index.html)" -eq 1
          test "$(grep -Fc "Shopify CSV import rejects malformed input without saving it and accepts a valid export-shaped file" browser-tests/v2-release-smoke.spec.js)" -eq 1
          test "$(grep -Fc "keyboard-only founder flow has skip navigation, labeled fields and operable quick actions" browser-tests/v2-release-smoke.spec.js)" -eq 1
          test "$(grep -Fc "Brand Engine generates founder directions" browser-tests/v2-release-smoke.spec.js)" -eq 1
          grep -Fq 'browser-tests/*.spec.js --project=chromium' .github/workflows/v2-browser-smoke.yml
          grep -Fq 'device-matrix-smoke.spec.js --project=webkit' .github/workflows/v2-browser-smoke.yml
          git diff --check

          # The merge itself must not alter existing workflow files.
          git diff --quiet HEAD -- .github/workflows/test.yml .github/workflows/v2-browser-smoke.yml

          git commit --no-edit
          git status --short
          git log --oneline --decorate -18

      - name: Push disposable integration candidate
        run: git push origin HEAD:full-stack-integration-candidate
