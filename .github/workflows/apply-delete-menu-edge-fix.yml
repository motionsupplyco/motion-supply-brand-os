name: Apply delete-menu edge fix
on:
  push:
    branches: [p0-production-hardening]
    paths: ['.github/workflows/apply-delete-menu-edge-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-delete-menu-edge-fix.mjs
      - run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - run: node --check server.js
      - run: |
          node --check public/app.js
          node --check public/account-ui.js
          node --check public/business-memory-ui.js
          node --check public/math.js
          node --check public/shopify.js
          node --check public/help.js
          node --check lib/stripe-webhook-state.js
      - run: npm test
      - name: Commit verified edge fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js tests/mobile-nav-contract.test.js
          git diff --cached --check
          git commit -m "Close mobile nav before brand deletion"
          git push origin HEAD:p0-production-hardening
