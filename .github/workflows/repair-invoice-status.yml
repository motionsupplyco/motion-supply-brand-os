name: Repair invoice status signal

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch invoice status signal
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          text=p.read_text()
          old="await upsertSubscriptionFromStripe(sub,event.data.object.status||event.type)"
          new="await upsertSubscriptionFromStripe(sub,event.type==='invoice.payment_failed'?'payment_failed':'paid')"
          assert text.count(old)==1, 'invoice status anchor changed'
          p.write_text(text.replace(old,new))
      - name: Verify syntax
        run: node --check server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Persist explicit Stripe payment failure state"
          git push origin HEAD:${{ github.head_ref }}
