name: Repair auth entrypoints

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Route all signed-out account entrypoints through production account UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/account-ui.js')
          text=p.read_text()
          old="  if(e.target.closest('#authBtn')){e.preventDefault();e.stopImmediatePropagation();showAccount();return}"
          new="  if(e.target.closest('#authBtn')){e.preventDefault();e.stopImmediatePropagation();showAccount();return}\n  if(e.target.closest('#inlineSignIn')){e.preventDefault();e.stopImmediatePropagation();showSignIn();return}\n  if(e.target.closest('#upgradeNow')&&!loadSession()){e.preventDefault();e.stopImmediatePropagation();showSignIn();return}"
          if new not in text:
            assert text.count(old)==1, 'account click capture anchor changed'
            text=text.replace(old,new)
          p.write_text(text)
      - name: Verify syntax
        run: node --check public/account-ui.js
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- public/account-ui.js; then
            echo "auth entrypoints already unified"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/account-ui.js
          git commit -m "Unify account sign-in entrypoints"
          git push origin HEAD:${{ github.head_ref }}
