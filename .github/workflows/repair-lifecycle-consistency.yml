name: Repair lifecycle consistency

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch lifecycle consistency
        shell: python
        run: |
          from pathlib import Path

          app=Path('public/app.js')
          text=app.read_text()
          replacements=[
            ("entitlement={plan:'free',active:false,limits:{brands:1,skus:5},usage:{brands:0,skus:0}}}updateAccount()",
             "entitlement={plan:'free',active:false,billingManageable:false,limits:{brands:1,skus:5},usage:{brands:0,skus:0}}}updateAccount()"),
            ("placeholder=\"Password (6+ characters)\"",
             "placeholder=\"Password (8+ characters)\"")
          ]
          for old,new in replacements:
            if new in text:
              continue
            assert old in text, f'app anchor changed: {old}'
            text=text.replace(old,new)
          app.write_text(text)

          server=Path('server.js')
          text=server.read_text()
          old="if(stripe&&sub?.stripe_subscription_id&&['active','trialing','past_due','unpaid','paused'].includes(sub.status))await stripe.subscriptions.cancel(sub.stripe_subscription_id)"
          new="if(stripe&&hasOpenStripeSub(sub))await stripe.subscriptions.cancel(sub.stripe_subscription_id)"
          if new not in text:
            assert text.count(old)==1, 'delete billing anchor changed'
            text=text.replace(old,new)
          server.write_text(text)
      - name: Verify syntax
        run: |
          node --check public/app.js
          node --check server.js
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- public/app.js server.js; then
            echo "lifecycle consistency already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js server.js
          git commit -m "Centralize billing lifecycle behavior"
          git push origin HEAD:${{ github.head_ref }}
