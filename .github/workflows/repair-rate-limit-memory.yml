name: Repair rate limiter memory bounds

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Bound in-process rate limiter state
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          text=p.read_text()
          old="const buckets=new Map();\nfunction limiter(name,windowMs,max){return(req,res,next)=>{const key=`${name}:${req.ip||'unknown'}`,now=Date.now(),x=buckets.get(key)||{count:0,start:now};if(now-x.start>windowMs){x.count=0;x.start=now}x.count++;buckets.set(key,x);if(x.count>max){res.setHeader('Retry-After',Math.ceil((windowMs-(now-x.start))/1000));return res.status(429).json({error:'Too many requests. Try again shortly.',code:'RATE_LIMITED'})}next()}}"
          new="const buckets=new Map(); const RATE_BUCKET_SOFT_LIMIT=5000,RATE_BUCKET_HARD_LIMIT=10000,RATE_BUCKET_MAX_AGE=60*60_000;\nfunction pruneRateBuckets(now){if(buckets.size<RATE_BUCKET_SOFT_LIMIT)return;for(const[k,x]of buckets){if(now-(x.touchedAt||x.start)>RATE_BUCKET_MAX_AGE)buckets.delete(k)}if(buckets.size>RATE_BUCKET_HARD_LIMIT){let remove=buckets.size-RATE_BUCKET_HARD_LIMIT;for(const k of buckets.keys()){buckets.delete(k);if(--remove<=0)break}}}\nfunction limiter(name,windowMs,max){return(req,res,next)=>{const key=`${name}:${req.ip||'unknown'}`,now=Date.now();pruneRateBuckets(now);const x=buckets.get(key)||{count:0,start:now,touchedAt:now};if(now-x.start>windowMs){x.count=0;x.start=now}x.count++;x.touchedAt=now;buckets.set(key,x);if(x.count>max){res.setHeader('Retry-After',Math.max(1,Math.ceil((windowMs-(now-x.start))/1000)));return res.status(429).json({error:'Too many requests. Try again shortly.',code:'RATE_LIMITED'})}next()}}"
          if new not in text:
            assert text.count(old)==1, 'rate limiter anchor changed'
            text=text.replace(old,new)
          p.write_text(text)
      - name: Verify syntax and tests
        run: |
          node --check server.js
          npm test
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- server.js; then
            echo "rate limiter already bounded"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Bound in-process rate limiter memory"
          git push origin HEAD:${{ github.head_ref }}
