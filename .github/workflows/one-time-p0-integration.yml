name: One-time P0 integration merge

on:
  push:
    branches: [p0-integration-candidate]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: p0-integration-candidate
          fetch-depth: 0
      - name: Merge verified P0 draft branches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branches=(
            p0-backup-recovery-runbook
            p0-production-observability
            p0-shopify-csv-hardening
            p0-accessibility-pass
            p0-device-qa-matrix
            p0-stripe-lifecycle-contract
            p0-two-user-isolation-contract
            p0-pin-node-24
          )
          git fetch origin "${branches[@]}"
          for branch in "${branches[@]}"; do
            echo "=== merging $branch ==="
            if ! git merge --no-ff --no-edit "origin/$branch"; then
              echo "::error::Conflict while merging $branch"
              git status --short
              git diff --name-only --diff-filter=U
              exit 1
            fi
          done
          git status --short
          git log --oneline --decorate -12
      - name: Push integration candidate
        run: git push origin HEAD:p0-integration-candidate
