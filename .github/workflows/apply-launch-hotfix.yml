name: Apply verified launch repair
on:
  push:
    branches: [p0-production-hardening]
    paths: ['.github/workflows/apply-launch-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply verified repair
        run: node scripts/apply-launch-hotfix.mjs
      - name: Verify lockfile is synchronized
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Syntax check server
        run: node --check server.js
      - name: Syntax check app modules
        run: |
          node --check public/app.js
          node --check public/account-ui.js
          node --check public/business-memory-ui.js
          node --check public/math.js
          node --check public/shopify.js
          node --check public/help.js
          node --check lib/stripe-webhook-state.js
      - name: Run full tests
        run: npm test
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js public/app.js public/account-ui.js public/business-memory-ui.js public/help.js tests/server-contract.test.js tests/recovery-contract.test.js tests/route-regression-contract.test.js tests/mobile-nav-contract.test.js
          git diff --cached --check
          git commit -m "Repair mobile navigation, recovery, and brand deletion"
          git push origin HEAD:p0-production-hardening
