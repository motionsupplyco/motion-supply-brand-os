name: Brand OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify lockfile is synchronized
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Syntax check server
        run: node --check server.js
      - name: Syntax check app modules
        run: |
          node --check public/app.js
          node --check public/account-ui.js
          node --check public/business-memory-ui.js
          node --check public/math.js
          node --check public/shopify.js
          node --check public/help.js
          node --check public/accessibility.js
          node --check public/workspace-route.js
          node --check public/settings-ui.js
          node --check public/problem-navigator.js
          node --check public/problem-navigator-ui.js
          node --check public/guided-dashboard.js
          node --check public/workspace-decision-context.js
          node --check public/advisor-guidance.js
          node --check public/advisor-resources.js
          node --check public/operating-intelligence.js
          node --check public/collection-stress.js
          node --check public/net-profit-guardrails.js
          node --check public/production-preflight.js
          node --check public/production-timeline.js
          node --check public/production-milestones.js
          node --check public/manufacturing-cash-transfer.js
          node --check public/v2-operating-ui.js
          node --check public/v2-planning-ui.js
          node --check public/net-profit-ui.js
          node --check public/collection-stress-ui.js
          node --check public/production-preflight-ui.js
          node --check public/factory-quote-ui.js
          node --check public/manufacturing-cash-handoff-ui.js
          node --check public/production-milestones-ui.js
          node --check public/production-alert-bridge-ui.js
          node --check public/brand-engine-core.js
          node --check public/brand-engine-analytics.js
          node --check public/brand-engine-ui.js
          node --check public/brand-engine-handoff.js
          node --check lib/stripe-webhook-state.js
          node --check lib/integration-crypto.js
          node --check lib/integration-providers.js
          node --check lib/shopify-sync.js
          node --check lib/shopify-webhooks.js
          node --check lib/v2-routes.js
          node --check lib/v2-planning-routes.js
          node --check lib/rdap-domain.js
          node --check lib/brand-engine-routes.js
      - name: Run tests
        run: npm test
