name: Brand OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check server
        run: node --check server.js
      - name: Syntax check app modules
        run: |
          node --check public/app.js
          node --check public/account-ui.js
          node --check public/math.js
          node --check public/shopify.js
          node --check public/help.js
          node --check lib/stripe-webhook-state.js
      - name: Run tests
        run: npm test
