name: Repair product event deletion cascade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Align fresh schema account deletion behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('sql/schema.sql')
          text=p.read_text()
          old="user_id uuid references auth.users(id) on delete set null,"
          new="user_id uuid references auth.users(id) on delete cascade,"
          if new not in text:
            assert text.count(old)==1, 'product_events FK anchor changed'
            text=text.replace(old,new)
          p.write_text(text)
      - name: Verify tests
        run: npm test
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- sql/schema.sql; then
            echo "schema already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql/schema.sql
          git commit -m "Cascade signed-in analytics on account deletion"
          git push origin HEAD:${{ github.head_ref }}
