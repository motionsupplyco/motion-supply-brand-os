name: Repair CSP connection boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Restrict browser connections to same origin
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          text=p.read_text()
          old="connect-src 'self' https://*.supabase.co;"
          new="connect-src 'self';"
          if new not in text:
            assert text.count(old)==1, 'CSP connect-src anchor changed'
            text=text.replace(old,new)
          p.write_text(text)
      - name: Verify syntax and tests
        run: |
          node --check server.js
          npm test
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- server.js; then
            echo "CSP already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Restrict browser network connections to app origin"
          git push origin HEAD:${{ github.head_ref }}
