name: Repair billing recovery flow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p0-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch billing recovery flow
        shell: python
        run: |
          from pathlib import Path

          server = Path('server.js')
          text = server.read_text()
          old = "const FREE_LIMITS=Object.freeze({brands:1,skus:5}); const isActiveSub=sub=>Boolean(sub&&['active','trialing'].includes(sub.status));"
          new = "const FREE_LIMITS=Object.freeze({brands:1,skus:5}); const isActiveSub=sub=>Boolean(sub&&['active','trialing'].includes(sub.status)); const hasOpenStripeSub=sub=>Boolean(sub?.stripe_subscription_id&&!['canceled','incomplete_expired'].includes(sub.status));"
          assert text.count(old) == 1, 'active-sub helper anchor changed'
          text = text.replace(old,new)

          old = "res.json({user:{id:user.id,email:user.email},plan:access.plan,active:access.active,limits:access.limits,usage})"
          new = "res.json({user:{id:user.id,email:user.email},plan:access.plan,active:access.active,billingManageable:hasOpenStripeSub(access.sub),limits:access.limits,usage})"
          assert text.count(old) == 1, 'account response anchor changed'
          text = text.replace(old,new)

          old = "const existing=await subscriptionForUser(user.id);if(isActiveSub(existing))return res.status(409).json({error:'You already have an active Pro subscription.',code:'ALREADY_PRO'});let customerId=existing?.stripe_customer_id||null;"
          new = "const existing=await subscriptionForUser(user.id);if(isActiveSub(existing))return res.status(409).json({error:'You already have an active Pro subscription.',code:'ALREADY_PRO'});if(hasOpenStripeSub(existing))return res.status(409).json({error:'Your existing subscription needs attention. Open billing to manage it.',code:'BILLING_RECOVERY_REQUIRED'});let customerId=existing?.stripe_customer_id||null;"
          assert text.count(old) == 1, 'checkout anchor changed'
          text = text.replace(old,new)
          server.write_text(text)

          ui = Path('public/account-ui.js')
          text = ui.read_text()
          old = "  const sub=entitlement.subscription||null;\n  const status=sub?.status?escapeHtml(sub.status.replaceAll('_',' ')):'none';"
          new = "  const sub=entitlement.subscription||null;\n  const manageBilling=Boolean(account.active||account.billingManageable);\n  const status=sub?.status?escapeHtml(sub.status.replaceAll('_',' ')):'none';"
          assert text.count(old) == 1, 'account UI state anchor changed'
          text = text.replace(old,new)

          old = "${config.billingConfigured?`<button id=\"acctBillingOpen\" class=\"primary\">${account.active?'Manage billing':'Upgrade to Pro'}</button>`:''}"
          new = "${config.billingConfigured?`<button id=\"acctBillingOpen\" class=\"primary\">${manageBilling?'Manage billing':'Upgrade to Pro'}</button>`:''}"
          assert text.count(old) == 1, 'billing button anchor changed'
          text = text.replace(old,new)

          old = "const billing=$('#acctBillingOpen');if(billing)billing.onclick=()=>openBilling(Boolean(account.active));"
          new = "const billing=$('#acctBillingOpen');if(billing)billing.onclick=()=>openBilling(manageBilling);"
          assert text.count(old) == 1, 'billing click anchor changed'
          text = text.replace(old,new)
          ui.write_text(text)
      - name: Verify syntax
        run: |
          node --check server.js
          node --check public/account-ui.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/account-ui.js
          git commit -m "Route existing Stripe subscriptions to billing recovery"
          git push origin HEAD:${{ github.head_ref }}
