<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0f1115" />
<title>Motion Supply Brand OS</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="styles-hotfix.css" />
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="sideTop">
      <div class="brand">
        <div class="mark">MS</div>
        <div class="brandcopy"><b>MOTION SUPPLY</b><small>BRAND OS</small></div>
      </div>
      <button id="menuCloseBtn" class="menuClose" type="button" aria-label="Close navigation">×</button>
    </div>
    <div class="navlabel">OPERATE</div>
    <nav id="nav">
      <div class="navgroup">Command Center</div>
      <button class="active" data-view="dashboard"><span>▦</span>Business Health</button>
      <button data-view="advisor"><span>→</span>Next Move</button>
      <button id="memoryNav"><span>◈</span>Business Memory</button>

      <div class="navgroup">Make Money</div>
      <button data-view="profit"><span>↗</span>Profit & Pricing</button>
      <button data-view="cac"><span>◎</span>Customer Acquisition</button>
      <button data-view="discount"><span>%</span>Discount Ceiling</button>
      <button data-view="launch"><span>△</span>Launch & Break-Even</button>

      <div class="navgroup">Read the Store</div>
      <button data-view="funnel"><span>⇢</span>Store Funnel</button>
      <button data-view="shopify"><span>S</span>Shopify Import</button>

      <div class="navgroup">Protect Cash</div>
      <button data-view="inventory"><span>□</span>Inventory & Reorder</button>
      <button data-view="cash"><span>$</span>Cash Checkpoint</button>
      <button data-view="po"><span>PO</span>PO Cash Gate</button>
      <button data-view="fulfillment"><span>↔</span>3PL Decision</button>

      <div class="navgroup">Expand & Organize</div>
      <button data-view="wholesale"><span>◇</span>Wholesale Economics</button>
      <button data-view="brands"><span>▤</span>Brands & SKUs</button>
    </nav>
    <div class="sidebottom">
      <button id="learnBtn" class="ghost">Start Here · Beginner Guide</button>
      <div class="sidehint">Need sample numbers?</div>
      <button id="demoBtn" class="ghost">Load Foundry Eight demo</button>
      <button id="freshBtn" class="ghost subtle">Start fresh</button>
    </div>
  </aside>
  <button id="menuBackdrop" class="menuBackdrop" type="button" aria-label="Close navigation"></button>
  <main>
    <header>
      <div class="headleft">
        <button id="menuBtn" class="menu" aria-label="Open navigation" aria-controls="side" aria-expanded="false">☰</button>
        <div>
          <span class="eyebrow">MOTION SUPPLY CO.</span>
          <h1 id="title">Business Health</h1>
        </div>
      </div>
      <div class="account">
        <span id="planPill" class="pill">LOCAL</span>
        <button id="authBtn" class="outline">Sign in</button>
        <button id="billingBtn" class="primary hidden">Upgrade</button>
      </div>
    </header>
    <section id="app" class="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox" role="dialog" aria-modal="true" aria-label="Brand OS dialog" tabindex="-1"><button id="closeModal" class="close" type="button" aria-label="Close dialog">×</button><div id="modalBody"></div></div></div>
<script type="module" src="account-ui.js"></script>
<script type="module" src="business-memory-ui.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="mobile-nav-a11y.js"></script>
<script type="module" src="modal-a11y.js"></script>
<script type="module" src="help.js"></script>
</body>
</html>
