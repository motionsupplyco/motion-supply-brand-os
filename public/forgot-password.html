<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Reset Password · Motion Supply Brand OS</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-hotfix.css">
</head>
<body>
<main class="legalpage authpage">
  <section class="legalcard authscreen">
    <span class="kicker">ACCOUNT RECOVERY</span>
    <h1>Reset your password</h1>
    <p class="mini">Enter the email tied to your Motion Supply Brand OS account. If an account exists, we’ll send a secure recovery link.</p>
    <div class="authform">
      <label class="mini" for="recoveryEmail">Email</label>
      <input id="recoveryEmail" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com">
      <button id="recoverySend" class="primary" type="button">Send recovery link</button>
      <div id="recoveryMessage" class="mini" role="status" aria-live="polite"></div>
      <a class="authlink" href="/">Back to Brand OS</a>
    </div>
  </section>
</main>
<script type="module" src="forgot-password.js"></script>
</body>
</html>
